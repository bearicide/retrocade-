<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12091f"><meta name="description" content="RETROCADE is a bright, mobile-friendly browser arcade by MATTBEAR."><title>RETROCADE | MATTBEAR</title><style>:root{--bg:#090612;--panel:#161126;--ink:#fffaff;--muted:#c7bdd4;--line:rgba(255,255,255,.14);--pink:#ff65bd;--cyan:#4edcff;--gold:#ffd66b;--green:#73eba8}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 5%,rgba(255,101,189,.22),transparent 28rem),radial-gradient(circle at 88% 8%,rgba(78,220,255,.18),transparent 30rem),linear-gradient(180deg,#150a22,var(--bg) 60%);overflow-x:hidden}.wrap{width:min(1180px,calc(100% - 20px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(9,6,18,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.top-inner{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:#fff;text-decoration:none;font-weight:1000;letter-spacing:.08em}.brand span{background:linear-gradient(90deg,#ff6969,#ffd66b,#73eba8,#4edcff,#a984ff,#ff65bd);-webkit-background-clip:text;background-clip:text;color:transparent}.tools{display:flex;gap:8px}.btn{min-height:48px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.08);color:#fff;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}.btn.primary{background:linear-gradient(135deg,var(--cyan),#8774ff);color:#07111a;border:0}.hero{padding:28px 0 18px;display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.panel{border:1px solid var(--line);border-radius:26px;background:rgba(22,17,38,.84);box-shadow:0 24px 75px rgba(0,0,0,.35)}.hero-copy{padding:clamp(20px,4vw,38px)}.kicker{color:var(--cyan);font-size:.76rem;font-weight:950;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:8px 0 10px;font-size:clamp(3.4rem,11vw,8rem);line-height:.82;letter-spacing:-.075em}.hero p{margin:0;color:var(--muted);font-size:clamp(1rem,2vw,1.16rem);line-height:1.5}.quick{padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}.stat span{color:var(--muted);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.stat strong{font-size:2rem}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 0 12px}.section-head h2{margin:0;font-size:clamp(2rem,5vw,3.8rem);letter-spacing:-.04em}.section-head p{margin:0;color:var(--muted);max-width:560px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:34px}.game{position:relative;min-height:258px;padding:14px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 16%,rgba(255,255,255,.04)),rgba(255,255,255,.035));display:flex;flex-direction:column;gap:10px;overflow:hidden;transition:transform .18s ease,border-color .18s ease}.game:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 70%,white)}.game .icon{height:88px;display:grid;place-items:center;font-size:3.7rem;border-radius:17px;background:rgba(0,0,0,.2)}.game h3{margin:0;font-size:1.35rem}.game p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}.play{margin-top:auto;width:100%;min-height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--accent),#fff0a8);color:#111;font-weight:1000;text-decoration:none;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.eye-on .play{min-height:72px}.eye-on .dwelling{outline:4px solid var(--gold);outline-offset:3px}.eye-on .dwelling:after{content:"";position:absolute;inset:0;background:rgba(255,214,107,.35);animation:dwell .9s linear forwards}@keyframes dwell{from{clip-path:inset(100% 0 0)}to{clip-path:inset(0)}}.hint{position:fixed;left:50%;bottom:18px;transform:translate(-50%,18px);opacity:0;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(15,10,26,.95);font-weight:900;pointer-events:none;transition:.2s}.hint.show{opacity:1;transform:translate(-50%,0)}@media(max-width:980px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.top-inner{align-items:stretch;flex-direction:column;padding:9px 0}.tools{display:grid;grid-template-columns:1fr 1fr}.hero{padding-top:14px}.quick{grid-template-columns:repeat(4,1fr)}.stat{min-height:72px;padding:10px}.stat strong{font-size:1.45rem}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{width:min(100% - 12px,1180px)}.hero-copy{padding:18px}.hero h1{font-size:3.9rem}.quick{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.game{min-height:230px}.section-head{align-items:flex-start;flex-direction:column}.btn{min-height:52px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style></head><body><header class="top"><div class="wrap top-inner"><a class="brand" href="./"><span>MATTBEAR</span> RETROCADE</a><div class="tools"><button class="btn" id="audioBtn" type="button">Sound Off</button><button hidden aria-hidden="true" tabindex="-1" class="btn" id="eyeBtn" type="button">Accessibility Mode</button></div></div></header><main class="wrap"><section class="hero"><div class="panel hero-copy"><span class="kicker">Pick a game and play</span><h1>RETRO<br>CADE</h1><p>Big controls. Simple instructions. Keyboard, mouse, touch, and optional large controls. No setup needed.</p></div><div class="panel quick"><div class="stat"><span>Games</span><strong>12</strong></div><div class="stat"><span>Coins</span><strong id="coins">500</strong></div><div class="stat"><span>Tickets</span><strong id="tickets">0</strong></div><div class="stat"><span>Level</span><strong id="level">1</strong></div></div></section><section><div class="section-head"><div><h2>Choose a game</h2><p>Every game works on phones, tablets, laptops, and desktops.</p></div></div><div class="grid" id="grid"></div></section></main><div class="hint" id="hint" role="status"></div><script>(()=>{const games=[['Snake','🐍','Grow longer without hitting the walls.','games/snake.html','#68e0a0'],['Breakout','🧱','Bounce the ball and clear the wall.','games/breakout.html','#35d6ff'],['Invaders','👾','Move, aim, and stop the alien wave.','games/invaders.html','#b889ff'],['Space Rocks','☄️','Fly, turn, and blast drifting rocks.','games/asteroids.html','#59e2ff'],['Pong','🏓','Move the paddle and return every shot.','games/pong.html','#ff78bd'],['Claw Machine','🕹️','Aim the claw and collect the prizes.','games/claw.html','#ffd166'],['Bubble Shooter','🫧','Match bright bubbles and clear the board.','games/bubble.html','#70e0ff'],['Memory Match','🧠','Flip cards and find every pair.','games/memory.html','#8b77ff'],['Mini Racer','🏎️','Change lanes and dodge traffic.','games/racer.html','#ff7b88'],['Rhythm Pads','🥁','Watch, listen, and repeat the pattern.','games/rhythm.html','#72eda8'],['Falling Blocks','🟪','Move quickly and dodge the falling shapes.','games/blocks.html','#ff9e62'],['Frog Cross','🐸','Hop through traffic and reach the park.','games/frog.html','#7bea8f']];const grid=document.getElementById('grid'),hint=document.getElementById('hint');let eye=false,dwell=null,ctx=null,sound=false;games.forEach(([name,icon,desc,url,color])=>{const el=document.createElement('article');el.className='game';el.style.setProperty('--accent',color);el.innerHTML=`<div class="icon">${icon}</div><h3>${name}</h3><p>${desc}</p><a class="play" href="${url}">Play ${name}</a>`;grid.appendChild(el)});function show(t){hint.textContent=t;hint.classList.add('show');clearTimeout(window._h);window._h=setTimeout(()=>hint.classList.remove('show'),1200)}function tone(){if(!sound)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440;o.type='triangle';o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.08);o.start();o.stop(ctx.currentTime+.09)}document.getElementById('audioBtn').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'Sound On':'Sound Off';tone();show(sound?'Sound enabled':'Sound muted')});document.getElementById('eyeBtn').addEventListener('click',e=>{eye=!eye;document.body.classList.toggle('eye-on',eye);e.currentTarget.textContent=eye?'Accessibility Mode On':'Accessibility Mode';show(eye?'Look at Play for one second':'Accessibility Mode off')});document.querySelectorAll('.play').forEach(a=>{a.addEventListener('pointerenter',()=>{tone();if(!eye)return;a.classList.add('dwelling');dwell=setTimeout(()=>a.click(),900)});a.addEventListener('pointerleave',()=>{clearTimeout(dwell);a.classList.remove('dwelling')})});try{const s=JSON.parse(localStorage.getItem('retrocadeState')||'{}');document.getElementById('coins').textContent=s.coins||500;document.getElementById('tickets').textContent=s.tickets||0;document.getElementById('level').textContent=Math.floor((s.xp||0)/100)+1}catch{}})();</script></body></html>
