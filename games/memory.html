<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Memory Match | RETROCADE</title>
<style>
:root{--bg:#090d18;--panel:rgba(18,25,45,.72);--panel2:rgba(255,255,255,.08);--ink:#f7f8ff;--muted:#aeb8d2;--line:rgba(255,255,255,.12);--accent:#7c5cff;--accent2:#21d4fd;--good:#6ee7b7;--warn:#fbbf24;--shadow:0 24px 80px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% 10%,rgba(124,92,255,.24),transparent 34rem),radial-gradient(circle at 88% 8%,rgba(33,212,253,.18),transparent 30rem),linear-gradient(180deg,#0d1222,#090d18 60%,#05070d);color:var(--ink)}
body{padding:18px;overflow-x:hidden}.app{width:min(1120px,100%);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.back{color:var(--ink);text-decoration:none;font-weight:800;letter-spacing:.04em}.pill{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);font-size:.85rem;font-weight:750}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch;margin-bottom:18px}.hero-copy,.stats{border:1px solid var(--line);border-radius:28px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.hero-copy{padding:28px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--accent2);font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:10px 0 8px;font-size:clamp(2.4rem,8vw,5.6rem);line-height:.92;letter-spacing:-.055em}.hero p{margin:0;color:var(--muted);font-size:1rem;line-height:1.55;max-width:42rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}.stat{min-height:112px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.045);padding:16px;display:flex;flex-direction:column;justify-content:space-between}.stat span{color:var(--muted);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.stat strong{font-size:clamp(1.7rem,5vw,2.8rem);letter-spacing:-.04em}
.game-shell{position:relative;border:1px solid var(--line);border-radius:30px;background:rgba(11,16,32,.78);box-shadow:var(--shadow);padding:18px;overflow:hidden}.game-shell:before{content:"";position:absolute;inset:-30% auto auto -10%;width:55%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.22),transparent 65%);pointer-events:none}.toolbar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar-copy strong{display:block;font-size:1rem}.toolbar-copy span{display:block;color:var(--muted);font-size:.88rem;margin-top:3px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:14px;padding:11px 15px;background:rgba(255,255,255,.07);color:var(--ink);font-weight:850;cursor:pointer;transition:.18s ease;touch-action:manipulation}.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.11)}.btn.primary{background:linear-gradient(135deg,var(--accent),#5a7cff);border-color:transparent;box-shadow:0 12px 28px rgba(124,92,255,.28)}
.board{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{position:relative;aspect-ratio:1.2;border:0;padding:0;background:none;cursor:pointer;perspective:900px;touch-action:manipulation}.card-inner{position:absolute;inset:0;transition:transform .48s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}.front{background:linear-gradient(145deg,rgba(124,92,255,.18),rgba(33,212,253,.08)),rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 24px rgba(0,0,0,.18)}.front:after{content:"✦";font-size:clamp(1.6rem,5vw,3rem);color:rgba(255,255,255,.72)}.back{transform:rotateY(180deg);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 14px 30px rgba(0,0,0,.25)}.symbol{font-size:clamp(2rem,7vw,4.2rem);filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}.card.matched .back{border-color:rgba(110,231,183,.6);box-shadow:0 0 0 2px rgba(110,231,183,.15),0 18px 34px rgba(0,0,0,.24)}.card.selected{outline:3px solid var(--accent2);outline-offset:4px;border-radius:24px}.card:focus-visible{outline:3px solid var(--accent2);outline-offset:4px;border-radius:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(12,18,34,.92);backdrop-filter:blur(16px);font-weight:850;box-shadow:var(--shadow);transition:.22s ease;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){body{padding:10px}.hero{grid-template-columns:1fr}.hero-copy{padding:22px}.stats{grid-template-columns:repeat(4,1fr)}.stat{min-height:82px;padding:12px}.stat strong{font-size:1.55rem}.game-shell{padding:12px;border-radius:22px}.toolbar{align-items:flex-start;flex-direction:column}.board{gap:9px}.face{border-radius:15px}.btn{padding:10px 12px}.pill{display:none}}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.board{gap:7px}.hero h1{font-size:3rem}.front:after{font-size:1.5rem}.symbol{font-size:2.2rem}}

/* RETROCADE tactile control system */
:root{--rc-edge:#73dcff;--rc-yellow:#ffda69}button{font-family:inherit;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;isolation:isolate;transition:transform .11s ease,box-shadow .11s ease,filter .11s ease!important}button:not(:disabled){border:2px solid #a9b7d177!important;border-radius:10px!important;background-image:linear-gradient(155deg,#ffffff35 0%,transparent 45%,#00000035 100%)!important;box-shadow:inset 0 2px 0 #ffffff3d,inset 0 -4px 0 #0007,0 5px 0 #03040b,0 9px 16px #0008!important;text-shadow:0 1px 1px #0008}button.primary,button.gold,button.active{border-color:#ffffff77!important;text-shadow:none!important}button:hover:not(:disabled){filter:brightness(1.16)}button:active:not(:disabled),button.rc-pressed{transform:translateY(4px)!important;box-shadow:inset 0 2px 6px #0007,0 1px 0 #03040b!important}button:focus-visible,a:focus-visible{outline:3px solid var(--rc-yellow)!important;outline-offset:3px}button:disabled{opacity:.48;cursor:not-allowed}.hero h1,.intro h1{filter:drop-shadow(3px 4px 0 #0008)}.stat{border-color:#ffffff25!important;box-shadow:inset 0 2px 0 #ffffff12}.stat strong,.stat b{font-variant-numeric:tabular-nums;text-shadow:0 0 14px #60cfff55}.panel,.game-shell,.shell,.game{border-color:#70c9ff38!important}.canvas-wrap,.play,.machine{box-shadow:inset 0 0 0 3px #050913,0 0 0 1px #7de2ff4d,0 12px 28px #0008}.side button{min-height:64px}.rc-sound{position:fixed!important;right:12px;bottom:12px;z-index:90;border:2px solid #9cf4ff!important;background:#18324b!important;color:#fff!important;min-height:48px;padding:9px 14px;font-weight:900;border-radius:10px!important}.rc-sound[aria-pressed="false"]{background:#30233b!important}.rc-sound:focus-visible{outline:3px solid #ffd66b!important}.rc-sound:after{content:"";position:absolute;inset:3px;border:1px solid #ffffff24;pointer-events:none}@media(max-width:800px){.stage{min-width:0}.side{min-width:0}.toolbar,.bar{gap:12px}.buttons,.actions,.btns{gap:10px!important}button{min-width:0}.hero{gap:9px!important}}@media(max-width:520px){body{padding:8px!important;padding-bottom:70px!important}.hero h1,.intro h1{font-size:clamp(2.6rem,12vw,3.5rem)!important}.hero-copy,.intro{padding:15px!important}.stat{min-height:62px!important;padding:9px!important}.side{grid-template-columns:1fr!important}.rc-sound{bottom:8px;right:8px;font-size:.8rem}.buttons button,.actions button,.btns button{flex:1 1 auto;min-height:48px}.stage canvas{max-width:100%}}@media(prefers-reduced-motion:reduce){button{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><a class="back" href="../index.html">← RETROCADE</a><span class="pill">MATTBEAR / MEMORY MATCH</span></header>
<section class="hero"><div class="hero-copy"><span class="eyebrow">Focus Mode • 16 Cards</span><h1>Memory Match</h1><p>Mouse or touch: tap cards. Keyboard: arrows choose a card and Enter or Space flips it.</p></div><div class="stats" aria-label="Game statistics"><div class="stat"><span>Moves</span><strong id="moves">0</strong></div><div class="stat"><span>Pairs</span><strong id="pairs">0/8</strong></div><div class="stat"><span>Streak</span><strong id="streak">0</strong></div><div class="stat"><span>Best</span><strong id="best">—</strong></div></div></section>
<section class="game-shell"><div class="toolbar"><div class="toolbar-copy"><strong>Match all eight pairs</strong><span>Use mouse, touch, arrows, Enter, or Space.</span></div><div class="buttons"><button class="btn" id="shuffleBtn" type="button">Shuffle</button><button class="btn primary" id="newBtn" type="button">New Game</button></div></div><div class="board" id="board" aria-label="Memory card grid" role="grid"></div></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const icons=['🐻','🌈','🎛️','🎧','⚡','🛸','🧠','🎟️'];
const board=document.getElementById('board'),movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),streakEl=document.getElementById('streak'),bestEl=document.getElementById('best'),toast=document.getElementById('toast');
let deck=[],open=[],matched=new Set(),moves=0,streak=0,locked=false,selected=0;
const best=Number(localStorage.getItem('retrocade-memory-best')||0);bestEl.textContent=best||'—';
function shuffle(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),1300)}
function updateStats(){movesEl.textContent=moves;pairsEl.textContent=(matched.size/2)+'/8';streakEl.textContent=streak}
function render(){board.innerHTML='';deck.forEach((value,index)=>{const card=document.createElement('button');card.type='button';card.className='card';card.setAttribute('role','gridcell');card.setAttribute('aria-label','Hidden memory card');card.tabIndex=index===selected?0:-1;card.innerHTML='<span class="card-inner"><span class="face front"></span><span class="face back"><span class="symbol">'+value+'</span></span></span>';if(index===selected)card.classList.add('selected');if(open.includes(index))card.classList.add('flipped');if(matched.has(index)){card.classList.add('matched');card.setAttribute('aria-label','Matched '+value)}card.addEventListener('click',()=>{selected=index;flip(index)});card.addEventListener('focus',()=>{selected=index;syncSelection()});board.appendChild(card)})}
function syncSelection(){[...board.children].forEach((card,index)=>{card.classList.toggle('selected',index===selected);card.tabIndex=index===selected?0:-1})}
function start(){deck=shuffle([...icons,...icons]);open=[];matched=new Set();moves=0;streak=0;locked=false;selected=0;updateStats();render()}
function flip(index){if(locked||matched.has(index)||open.includes(index))return;open.push(index);render();if(open.length<2)return;moves++;locked=true;const[a,b]=open;if(deck[a]===deck[b]){matched.add(a);matched.add(b);streak++;open=[];locked=false;updateStats();render();notify(streak>1?'Streak x'+streak:'Pair matched');if(matched.size===deck.length){const previous=Number(localStorage.getItem('retrocade-memory-best')||0);if(!previous||moves<previous){localStorage.setItem('retrocade-memory-best',moves);bestEl.textContent=moves;notify('New best: '+moves+' moves')}else notify('Board cleared in '+moves+' moves')}}else{streak=0;updateStats();setTimeout(()=>{open=[];locked=false;render()},650)}}
function moveSelection(dx,dy){const row=Math.floor(selected/4),col=selected%4;selected=((Math.max(0,Math.min(3,row+dy)))*4)+Math.max(0,Math.min(3,col+dx));syncSelection();board.children[selected]?.focus()}
document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();moveSelection(-1,0)}else if(event.key==='ArrowRight'){event.preventDefault();moveSelection(1,0)}else if(event.key==='ArrowUp'){event.preventDefault();moveSelection(0,-1)}else if(event.key==='ArrowDown'){event.preventDefault();moveSelection(0,1)}else if((event.key==='Enter'||event.key===' ')&&!event.target.closest('.buttons')){event.preventDefault();flip(selected)}else if(event.key.toLowerCase()==='r'){start()}});
document.getElementById('newBtn').addEventListener('click',start);
document.getElementById('shuffleBtn').addEventListener('click',()=>{if(matched.size){notify('Start a new game to reshuffle');return}deck=shuffle(deck);render();notify('Shuffled')});
start();
})();
</script>
<script>
/* RETROCADE supplemental cabinet audio: gesture-activated and locally muted */
(()=>{let ctx=null,enabled=false;try{enabled=localStorage.getItem('retrocadeFx')==='on'}catch{}const button=document.createElement('button');button.type='button';button.className='rc-sound';button.setAttribute('aria-label','Toggle arcade interface sound effects');function label(){button.textContent=enabled?'🔊 Arcade FX ON':'🔇 Arcade FX OFF';button.setAttribute('aria-pressed',String(enabled))}label();document.body.appendChild(button);function chirp(kind){if(!enabled)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ctx=ctx||new A();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='confirm'?'triangle':'square';o.frequency.setValueAtTime(kind==='confirm'?390:260,t);o.frequency.exponentialRampToValueAtTime(kind==='confirm'?760:185,t+.075);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.12)}catch{}}button.addEventListener('click',()=>{enabled=!enabled;try{localStorage.setItem('retrocadeFx',enabled?'on':'off')}catch{}label();chirp('confirm')});document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b===button||b.disabled)return;b.classList.add('rc-pressed');chirp(/start|spin|launch|fire|play|new|reset/i.test(b.textContent)?'confirm':'tap')},{passive:true});document.addEventListener('pointerup',()=>document.querySelectorAll('.rc-pressed').forEach(b=>b.classList.remove('rc-pressed')),{passive:true});document.addEventListener('pointercancel',()=>document.querySelectorAll('.rc-pressed').forEach(b=>b.classList.remove('rc-pressed')),{passive:true});})();
</script></body>
</html>
